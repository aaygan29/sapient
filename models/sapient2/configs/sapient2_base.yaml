# sapient-2 BASE config — same architecture as sapient-1, different data.
# Inherit from this in variant configs; override only what changes.
#
# Source of truth for architecture: engineering-outline/08_sapient1_sapient2_spec.md
# §3 + the "Architecture lock" in 00_HANDOFF_README.md. Decision numbers
# below refer to that lock.

model:
  # Modality feature dims (set by upstream encoder; d_text overridden per variant)
  d_video: 1408            # V-JEPA 2 Gigantic
  d_audio: 1024            # W2V-BERT 2.0
  d_text:  3072            # Llama-3.2-3B

  # Transformer body — identical to sapient-1
  hidden: 1152
  n_layers: 8
  n_heads: 8
  ff_mult: 4
  dropout: 0.1
  pre_norm: true
  activation: gelu

  # Output head (decision #7)
  low_rank_dim: 2048
  n_vertices: 20484

  # Regularization (decisions #1, #2)
  modality_dropout: 0.3
  subject_dropout: 0.1

  # Sequence length (decisions #3, #4, #5)
  max_stim_len: 200
  max_fmri_len: 100
  pos_embed_init_std: 0.02
  pool_to_1hz: mean
  pos_embed_post_pool: true

  # Subjects (decision #13): ~75 for sapient-2 (50 ds004996 + 25 ds001740).
  # Final value verified post-QC during data prep.
  n_subjects: 75

  # HRF (decision #8)
  hrf_offset_trs: 5

data:
  duration_trs: 100
  fmri_dim: 20484
  stim_rate_hz: 2
  fmri_rate_hz: 1
  resample_fmri_to_1hz: true

train:
  optimizer: AdamW
  # lr is overridden per variant: 1e-4 for scratch, 5e-5 for ft (decision #11)
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  lr_schedule: OneCycleLR
  pct_start: 0.1
  epochs: 15
  batch_size: 8
  grad_accum_steps: 2
  grad_clip: 1.0
  precision: bf16-mixed

  # Loss (decision #15)
  loss: masked_mse

  # Logging
  log_every: 50
  val_every: 1
  save_best_metric: vertex_pearson_mean
  seed: 42

eval:
  # Decision #10: Schaefer atlas in post-processing only
  parcellation:
    atlas: schaefer_2018
    n_rois: 1000
    yeo_networks: 7
    resolution_mm: 2
    cache_path: data/parcellate.npz

  metrics:
    - vertex_pearson_mean
    - vertex_pearson_top10pct_mean
    - parcel_pearson_mean
    - parcel_pearson_per_subject       # sapient-2 cares about per-subject generalization

  brain_surface_plot:
    output_dir: eval/figures
    plot_type: stat_map
    threshold: 0.05

  splits:
    # Per spec §5.1 sapient-2 split strategy
    train: 80% subjects × 80% runs
    val:   20% subjects × all runs    # subject-novel
    test:  all subjects × 20% runs    # stimulus-novel
