[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapient2"
version = "0.1.0"
description = "Conversation-specialized brain encoder. Same architecture as sapient-1, trained on ds004996 + ds001740 HRI corpora."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "The Sapient Company" }]
keywords = ["brain-encoding", "fmri", "multimodal", "human-robot-interaction", "neuroscience"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.4,<3",
  "torchaudio>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.25,<2",
  "safetensors>=0.4",
  "einops>=0.8",
  "nilearn>=0.10.4",
  "nibabel>=5.2",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "pyyaml>=6",
  "tqdm>=4.66",
  "datalad>=1.0",
  "wandb>=0.17",
  "modal>=0.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
"Hugging Face (scratch)" = "https://huggingface.co/The-Sapient-Company/sapient-2-scratch-llama"
"Hugging Face (ft)" = "https://huggingface.co/The-Sapient-Company/sapient-2-ft-llama"
"Source" = "https://github.com/The-Sapient-Company/sapient-models"

[tool.setuptools.packages.find]
include = ["sapient2*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
  "slow: long-running tests (skipped by default; run with `pytest -m slow`)",
]
