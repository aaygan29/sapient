# Experiment 2 — Attention Pooling on Backbone Features
#
# Hypothesis: mean-pooling backbone tokens loses spatial detail the brain actually
# uses. Learned attention pooling lets the model pick which regions matter per TR.
#
# Status: READY — not started

inherits: ../configs/mary_multi_v2.yaml
variant_name: exp_02_attention_pooling

model:
  backbone_pooling: attention  # was mean — learned query per stream
  n_fusion_layers: 2           # was 1 — extra capacity to process richer tokens

train:
  max_epochs: 120
  early_stopping_patience: 25
  batch_size: 16
  learning_rate: 1.5e-4        # was 3e-4 — lower LR for more complex pooling
  timeout_seconds: 21600       # 6h cap
