[project]
name = "sapient-serving"
version = "0.1.0"
description = "Secure, access-controlled hosting layer for the Sapient-1 brain encoder. Serves ROI + parcel summaries + a brain image over an authenticated API. Weights never leave the server."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Runtime deps for the API + the MOCK engine (no GPU, no model weights).
# This is intentionally light so the whole stack runs end-to-end before a
# checkpoint exists. The real model deps live in the [project.optional-dependencies] "real" extra.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Installed only on the GPU box that runs the real model. Pulls in the
# private sapient1 package (the audited model) + the frozen feature encoders.
real = [
    "torch>=2.2",
    "transformers>=4.40",
    "scipy>=1.10",
    "nilearn>=0.10",
    "huggingface_hub>=0.23",
    # The real model package itself. Install from the private repo on the deploy box, e.g.:
    #   pip install "sapient1 @ git+https://github.com/The-Sapient-Company/sapient-models.git#subdirectory=sapient1"
    # (left out here so `pip install -e .` works locally in mock mode without credentials)
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sapient_serving*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
